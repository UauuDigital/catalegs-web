<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UAUU — Weddings & Events</title>
  <link rel="preconnect" href="https://uauu.cat">
  <link rel="dns-prefetch" href="https://uauu.cat">
  <link rel="stylesheet" href="css/styles.css?v=6">
</head>
<body>

  <!-- Background video -->
  <div class="video-bg">
    <video autoplay muted loop playsinline>
      <source src="https://uauu.cat/media/videos/portada-web.mp4" type="video/mp4">
    </video>
  </div>

  <!-- ── HEADER ── -->
  <header class="site-header" id="siteHeader">
    <div class="hdr-side">
      <button class="menu-btn" id="menuOpenBtn" aria-label="Abrir menú">
        <div class="menu-btn-lines"><i></i><i></i></div>
        Menu
      </button>
    </div>

    <div class="hdr-logo">
      <img id="hdr-uauu-logo" src="logos/UAUU_lletra_blanca-02_ajustat.png" alt="UAUU Weddings &amp; Events">
      <div class="hdr-venue-name" id="hdr-venue-name"></div>
    </div>

    <div class="hdr-side">
      <a class="book-link"
         href="https://espaigastronomia.simplybook.it/v2/#book"
         target="_blank" rel="noopener noreferrer">
        Reservar visita presencial
      </a>
    </div>
  </header>

  <!-- ── MENU OVERLAY ── -->
  <div class="menu-overlay" id="menuOverlay" role="dialog" aria-modal="true" aria-label="Menú de navegación">

    <div class="overlay-bar">
      <button class="overlay-close" id="menuCloseBtn" aria-label="Cerrar menú">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <line x1="1.5" y1="1.5" x2="11.5" y2="11.5" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="11.5" y1="1.5" x2="1.5"  y2="11.5" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        Cerrar
      </button>

      <div class="overlay-bar-logo">
        <img src="logos/UAUU_lletra_blanca-02_ajustat.png" alt="UAUU">
      </div>

      <a class="overlay-book"
         href="https://espaigastronomia.simplybook.it/v2/#book"
         target="_blank" rel="noopener noreferrer">
        Reservar visita presencial
      </a>
    </div>

    <nav class="overlay-nav" id="overlayNav" aria-label="Páginas anteriores"></nav>
  </div>

  <!-- ── PAGES ── -->
  <div class="pages-wrap">

    <!-- Page 0 — Language -->
    <div class="page is-active" id="page-0">
      <div class="wheel-track" id="track-0">
        <div class="wheel-list" id="list-0"></div>
      </div>
      <div class="mob-sel-wrap" id="mob-sel-wrap">
        <div class="mob-sel-group">
          <label class="mob-sel-label" id="mob-label-lang">Idioma</label>
          <div class="mob-sel-field">
            <select class="mob-sel" id="mob-lang">
              <option value="Català">Català</option>
              <option value="Español">Español</option>
              <option value="English">English</option>
            </select>
          </div>
        </div>
        <div class="mob-sel-group">
          <label class="mob-sel-label" id="mob-label-year">Any</label>
          <div class="mob-sel-field">
            <select class="mob-sel" id="mob-year">
              <option value="2026">2026</option>
              <option value="2027" selected>2027</option>
            </select>
          </div>
        </div>
        <button class="mob-sel-cta" id="mob-sel-cta">
          <span id="mob-sel-cta-label">Continuar</span>
          <span class="mob-sel-cta-arrow"></span>
        </button>
      </div>
    </div>

    <!-- Page 1 — Year -->
    <div class="page is-below" id="page-1">
      <div class="wheel-track" id="track-1">
        <div class="wheel-list" id="list-1"></div>
      </div>
    </div>

    <!-- Page 2 — Quatre escenaris -->
    <div class="page is-below" id="page-2">
      <div class="p3-layout">
        <div class="p3-left">
          <div class="p3-h1" id="p3-h1"></div>
          <div class="p3-h2" id="p3-h2"></div>
          <button class="p3-cta" id="p3-cta">
            <span id="p3-cta-label"></span>
            <span class="p3-cta-arrow"></span>
          </button>
        </div>
        <div class="p3-right" id="p3-right">
          <svg class="p3-arc-svg" id="p3-svg"></svg>
          <div class="p3-items" id="p3-items"></div>
        </div>
      </div>
      <!-- Mobile swipe layout -->
      <div class="p2-mobile" id="p2-mobile">
        <div class="p2-mob-intro">
          <div class="p2-mob-h1" id="p2-mob-h1"></div>
          <div class="p2-mob-h2" id="p2-mob-h2"></div>
        </div>
        <div class="p2-mob-slides-wrap">
          <div class="p2-mob-slides" id="p2-mob-slides"></div>
        </div>
        <button class="p3-cta p2-mob-cta" id="p2-mob-cta">
          <span id="p2-mob-cta-label"></span>
          <span class="p3-cta-arrow"></span>
        </button>
        <div class="p2-mob-dots" id="p2-mob-dots"></div>
      </div>
    </div>

    <!-- Page 3 — Escollir espai -->
    <div class="page is-below" id="page-3">
      <div class="p4-layout">
        <div class="p4-left" id="p4-list"></div>
        <div class="p4-center">
          <img class="p4-img" id="p4-img" src="" alt="">
        </div>
        <div class="p4-right">
          <div class="p4-info" id="p4-info">
            <div class="p4-info-block">
              <div class="p4-info-title" id="p4-lbl-essencia"></div>
              <div class="p4-info-text"  id="p4-val-essencia"></div>
            </div>
            <div class="p4-info-block">
              <div class="p4-info-title" id="p4-lbl-capacitat"></div>
              <div class="p4-info-text"  id="p4-val-capacitat"></div>
            </div>
            <div class="p4-info-block">
              <div class="p4-info-title" id="p4-lbl-ubicacio"></div>
              <div class="p4-info-text"  id="p4-val-ubicacio"></div>
            </div>
          </div>
        </div>
      </div>
      <!-- Mobile cards layout -->
      <div class="p3-mob-cards" id="p3-mob-cards"></div>
    </div>

    <!-- Page 4 — Venue detail -->
    <div class="page is-below" id="page-4">
      <div class="p5-layout">
        <div class="p5-left" id="p5-list"></div>
      </div>
      <div class="mob-cards-wrap" id="mob-cards-wrap"></div>
    </div>

    <!-- Page 5 — Item detail -->
    <div class="page is-below" id="page-5">
<div class="p6-layout" id="p6-layout">
        <div class="p6-left"       id="p6-list"></div>
        <div class="p6-mob-nav"    id="p6-mob-nav"></div>
        <div class="p6-center"     id="p6-center"></div>
        <div class="p6-right"      id="p6-right"></div>
      </div>
    </div>

  </div>

  <script src="js/main.js?v=6"></script>

</body>
</html>

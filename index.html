<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UAUU — Weddings & Events</title>
  <style>
    @font-face {
      font-family: 'Ogg';
      src: url('fonts/OGG MEDIUM/Ogg-Medium.ttf') format('truetype');
      font-weight: 500; font-display: swap;
    }
    @font-face {
      font-family: 'Inter';
      src: url('fonts/Inter-VariableFont_opsz,wght.ttf') format('truetype');
      font-weight: 100 900; font-display: swap;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #221F1E; }

    /* ── VIDEO ── */
    .video-bg { position: fixed; inset: 0; z-index: 0; }
    .video-bg video { width: 100%; height: 100%; object-fit: cover; }

    /* Base dark layer + stronger gradient at top for header legibility */
    .video-bg::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(34,31,30,0.82)   0%,
        rgba(34,31,30,0.38)  20%,
        rgba(34,31,30,0.38) 100%
      );
      pointer-events: none;
    }

    /* ── HEADER ── */
    .site-header {
      position: fixed; z-index: 20;
      top: 0; left: 0; right: 0; height: 80px;
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 0 44px;
    }

    /* Logo always visible, centred */
    .hdr-logo {
      position: absolute; left: 50%;
      transform: translateX(-50%);
      cursor: pointer;
    }
    .hdr-logo img { height: 48px; width: auto; display: block; }

    /* Menu + book-link fade in from page 2 onwards */
    .hdr-side {
      opacity: 0; pointer-events: none;
      transition: opacity 0.55s ease;
    }
    .site-header.nav-on .hdr-side {
      opacity: 1; pointer-events: auto;
    }

    .menu-btn {
      display: flex; align-items: center; gap: 9px;
      font-family: 'Inter', sans-serif; font-size: 13px;
      font-weight: 400; letter-spacing: 0.06em; text-transform: uppercase;
      color: #fff; background: none; border: none; cursor: pointer; padding: 0;
    }
    .menu-btn-lines { display: flex; flex-direction: column; gap: 4.5px; }
    .menu-btn-lines i { display: block; width: 18px; height: 1.5px; background: #fff; border-radius: 1px; }

    .book-link {
      font-family: 'Inter', sans-serif; font-size: 13px;
      font-weight: 400; letter-spacing: 0.01em;
      color: #fff; text-decoration: none;
    }
    .book-link:hover { opacity: 0.65; }

    /* ── MENU OVERLAY ── */
    .menu-overlay {
      position: fixed; inset: 0; z-index: 50;
      background: #221F1E;
      display: flex; flex-direction: column;
      justify-content: center;
      padding: 80px 64px 64px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.38s ease;
    }
    .menu-overlay.open { opacity: 1; pointer-events: auto; }

    /* Overlay header bar (same layout as site-header) */
    .overlay-bar {
      position: absolute;
      top: 0; left: 0; right: 0; height: 80px;
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 0 44px;
    }
    .overlay-bar-logo { position: absolute; left: 50%; transform: translateX(-50%); }
    .overlay-bar-logo img { height: 48px; width: auto; display: block; }

    .overlay-close {
      display: flex; align-items: center; gap: 9px;
      font-family: 'Inter', sans-serif; font-size: 13px;
      font-weight: 400; letter-spacing: 0.06em; text-transform: uppercase;
      color: #fff; background: none; border: none; cursor: pointer; padding: 0;
    }
    .overlay-close svg { flex-shrink: 0; }

    .overlay-book {
      font-family: 'Inter', sans-serif; font-size: 13px;
      font-weight: 400; letter-spacing: 0.01em;
      color: #fff; text-decoration: none;
    }
    .overlay-book:hover { opacity: 0.65; }

    /* Nav items (previous pages) */
    .overlay-nav { display: flex; flex-direction: column; }
    .overlay-nav-item {
      font-family: 'Ogg', Georgia, serif;
      font-size: 72px; line-height: 1.05;
      color: rgba(255,255,255,0.4);
      background: none; border: none;
      cursor: pointer; text-align: left; padding: 4px 0;
      transition: color 0.22s ease;
    }
    .overlay-nav-item:hover { color: #fff; }

    /* ── PAGES ── */
    .pages-wrap { position: fixed; inset: 0; z-index: 1; }

    .page {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      /* opacity fades cleanly; transform uses expo-out so it floats and settles softly */
      transition: opacity 0.48s ease,
                  transform 0.62s cubic-bezier(.22,1,.36,1);
    }
    .page.is-active { opacity: 1;  transform: translateY(0);    pointer-events: auto; }
    .page.is-above  { opacity: 0;  transform: translateY(-52px); pointer-events: none; }
    .page.is-below  { opacity: 0;  transform: translateY(52px);  pointer-events: none; }

    /* ── WHEEL ── */
    .wheel-track {
      width: 600px; max-width: 92vw; height: 400px;
      touch-action: none; cursor: grab;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 21%, black 79%, transparent 100%);
      mask-image:         linear-gradient(to bottom, transparent 0%, black 21%, black 79%, transparent 100%);
    }
    .wheel-track:active { cursor: grabbing; }
    .wheel-list {
      width: 100%;
      display: flex; flex-direction: column; align-items: center;
      will-change: transform;
    }
    .wheel-item {
      width: 100%; height: 80px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Ogg', Georgia, serif;
      color: #fff; white-space: nowrap; cursor: pointer;
    }

    /* ── PAGE 3 — Quatre escenaris ── */
    #page-2 { align-items: stretch; justify-content: stretch; }

    .p3-layout {
      width: 100%; height: 100%;
      display: flex; align-items: center;
    }

    .p3-left {
      flex: 0 0 45%;
      padding: 0 0 0 10%;
      display: flex; flex-direction: column; justify-content: center;
    }
    .p3-h1 {
      font-family: 'Ogg', Georgia, serif;
      font-size: clamp(30px, 4.2vw, 66px);
      color: #fff;
      line-height: 1.05; letter-spacing: -0.025em;
    }
    .p3-h2 {
      font-family: 'Ogg', Georgia, serif;
      font-size: clamp(30px, 4.2vw, 66px);
      color: #fff;
      line-height: 1.05; letter-spacing: -0.025em;
      margin-top: 0.3em;
    }

    .p3-cta {
      margin-top: 56px;
      display: inline-flex; align-items: center; gap: 14px;
      font-family: 'Inter', sans-serif;
      font-size: 11px; font-weight: 400; letter-spacing: 0.14em; text-transform: uppercase;
      color: #fff;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 100px;
      padding: 15px 28px 15px 32px;
      cursor: pointer;
      transition: border-color 0.35s ease, background 0.35s ease, gap 0.35s cubic-bezier(.22,1,.36,1);
    }
    .p3-cta:hover {
      border-color: rgba(255,255,255,0.85);
      background: rgba(255,255,255,0.07);
      gap: 22px;
    }
    .p3-cta-arrow {
      display: block; position: relative;
      width: 28px; height: 1px; background: currentColor; flex-shrink: 0;
    }
    .p3-cta-arrow::after {
      content: ''; position: absolute;
      right: 0; top: 50%;
      width: 6px; height: 6px;
      border-right: 1px solid currentColor;
      border-top: 1px solid currentColor;
      transform: translateY(-50%) rotate(45deg);
    }

    .p3-right {
      flex: 0 0 55%;
      position: relative; height: 100%;
    }
    .p3-arc-svg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      overflow: visible; pointer-events: none;
    }
    .p3-items { position: absolute; inset: 0; }

    .p3-item {
      position: absolute;
      display: flex; align-items: center;
      transform: translateY(-50%);
      cursor: pointer; user-select: none;
    }
    .p3-item-info {
      flex-shrink: 0;
      text-align: right; padding-right: 22px;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .p3-item-info.hidden {
      opacity: 0; transform: translateX(10px); pointer-events: none;
    }
    .p3-item-label {
      font-family: 'Inter', sans-serif;
      font-size: 22px; font-weight: 600;
      color: #fff; letter-spacing: 0.06em; text-transform: uppercase;
    }
    .p3-item-desc {
      font-family: 'Inter', sans-serif;
      font-size: 16px; font-weight: 300;
      color: rgba(255,255,255,0.6);
      line-height: 1.45;
    }
    .p3-item-num {
      font-family: 'Ogg', Georgia, serif;
      color: #fff; line-height: 1;
    }
    .p3-item-dot {
      width: 5px; height: 5px;
      background: #fff; border-radius: 50%;
      flex-shrink: 0; margin-left: 9px;
      transition: opacity .35s ease;
    }

    /* ── HEADER LIGHT THEME (pages with cream bg) ── */
    .site-header.is-light .menu-btn        { color: #221F1E; }
    .site-header.is-light .menu-btn-lines i { background: #221F1E; }
    .site-header.is-light .book-link       { color: #221F1E; }
    .site-header.is-light .book-link:hover { opacity: 0.5; }
    .site-header.is-light .hdr-logo img    { filter: invert(1); }

    /* ── HEADER VENUE NAME (page 4) ── */
    .hdr-venue-name {
      font-family: 'Ogg', Georgia, serif;
      font-size: 28px; line-height: 1.1; letter-spacing: -0.02em;
      color: #fff; text-align: center; max-width: 220px;
      display: none;
    }
    .site-header.is-venue #hdr-uauu-logo { display: none; }
    .site-header.is-venue .hdr-venue-name { display: block; }

    /* ── PAGE 4 — ESCOLLIR ESPAI ── */
    #page-3 { background: #F2EFEE; align-items: stretch; justify-content: stretch; }

    .p4-layout {
      width: 100%; height: 100%;
      display: flex; align-items: center;
    }

    .p4-left {
      flex: 0 0 40%;
      padding: 0 0 0 10%;
      display: flex; flex-direction: column; justify-content: center;
    }
    .p4-item {
      font-family: 'Ogg', Georgia, serif;
      font-size: clamp(34px, 5.2vw, 82px);
      line-height: 1.12; letter-spacing: -0.025em;
      color: #221F1E; cursor: pointer;
      padding: 0.18em 0;
      transition: opacity 0.3s ease;
    }
    .p4-left.has-hover .p4-item            { opacity: 0.28; }
    .p4-left.has-hover .p4-item.is-active  { opacity: 1; }


    .p4-center {
      flex: 0 0 40%;
      height: 100%;
      display: flex; align-items: center;
      padding: 0 20px;
    }
    .p4-img {
      width: 100%; height: 76%;
      object-fit: cover; border-radius: 16px;
      opacity: 0; transition: opacity 0.4s ease;
    }
    .p4-img.is-visible { opacity: 1; }

    .p4-right {
      flex: 0 0 20%;
      align-self: stretch;
      padding-right: 5%;
      padding-bottom: 12vh;
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    .p4-info {
      opacity: 0; transition: opacity 0.4s ease;
    }
    .p4-info.is-visible { opacity: 1; }
    .p4-info-block { margin-bottom: 16px; }
    .p4-info-block:last-child { margin-bottom: 0; }
    .p4-info-title {
      font-family: 'Inter', sans-serif;
      font-size: clamp(22px, 2.6vw, 38px);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #221F1E;
      line-height: 1.1;
    }
    .p4-info-text {
      font-family: 'Inter', sans-serif;
      font-size: 14px; font-weight: 300;
      color: rgba(34,31,30,0.7);
      line-height: 1.5; margin-top: 5px;
    }

    /* ── PAGE 5 — VENUE DETAIL ── */
    #page-4 { background: #221F1E; align-items: stretch; justify-content: stretch; }
    .p5-layout {
      width: 100%; height: 100%;
      display: flex; align-items: center;
    }
    .p5-left {
      padding: 0 0 0 10%;
      display: flex; flex-direction: column; justify-content: center;
    }
    .p5-item {
      font-family: 'Ogg', Georgia, serif;
      font-size: clamp(20px, 2.8vw, 42px);
      line-height: 1.12; letter-spacing: -0.025em;
      color: #fff; cursor: pointer;
      padding: 0.12em 0;
      transition: opacity 0.3s ease;
    }
    .p5-left.has-hover .p5-item           { opacity: 0.22; }
    .p5-left.has-hover .p5-item.is-active { opacity: 1; }

    /* ── PAGE 5 — ITEM DETAIL ── */
    #page-5 { background: #221F1E; align-items: stretch; justify-content: stretch; }
    .year-notice {
      position: absolute; top: 80px; left: 0; right: 0; z-index: 5;
      height: 36px; display: none; align-items: center; justify-content: center;
      background: rgba(242,239,238,0.09); border-bottom: 1px solid rgba(242,239,238,0.12);
      font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 400;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: rgba(242,239,238,0.6);
    }
    .year-notice.is-visible { display: flex; }
    #page-5.has-notice .p6-layout { margin-top: 36px; height: calc(100% - 36px); }
    .p6-layout { width: 100%; height: 100%; display: flex; align-items: stretch; }
    .p6-layout.is-galeria .p6-right  { display: none; }
    .p6-layout.is-galeria .p6-center { flex: 1; overflow-y: auto; }
    .p6-layout.is-preus .p6-center   { display: none; }
    .p6-layout.is-preus .p6-right    { flex: 1; padding: 96px 4% 52px; justify-content: center; align-items: stretch; }

    .p6-left {
      flex: 0 0 26%;
      padding: 80px 0 60px 10%;
      display: flex; flex-direction: column; justify-content: center;
      overflow: hidden;
    }
    .p6-item {
      font-family: 'Ogg', Georgia, serif;
      font-size: clamp(14px, 1.85vw, 29px);
      line-height: 1.22; letter-spacing: -0.025em;
      color: #fff; cursor: pointer; padding: 0.1em 0;
      transition: opacity 0.3s ease;
    }
    .p6-left.has-hover .p6-item           { opacity: 0.22; }
    .p6-left.has-hover .p6-item.is-active { opacity: 1; }

    .p6-center {
      flex: 0 0 44%;
      padding: 96px 16px 52px;
      display: flex; flex-direction: column;
    }
    .p6-media {
      flex: 1; min-height: 0;
      border-radius: 18px; overflow: hidden; position: relative;
    }
    .p6-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .p6-media-empty {
      flex: 1; min-height: 0;
      background: rgba(255,255,255,0.04); border-radius: 18px;
    }

    /* Carousel */
    .p6-carousel-wrap { position: relative; width: 100%; flex: 1; min-height: 0; }
    .p6-carousel-track { width: 100%; height: 100%; position: relative; border-radius: 18px; overflow: hidden; }
    .p6-carousel-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.55s ease; }
    .p6-carousel-slide.is-active { opacity: 1; }
    .p6-carousel-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .p6-carousel-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: calc(100% + 32px); left: -16px;
      display: flex; justify-content: space-between; pointer-events: none;
    }
    .p6-carousel-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(34,31,30,0.6); border: 1px solid rgba(255,255,255,0.15);
      color: #fff; cursor: pointer; pointer-events: auto;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s ease;
    }
    .p6-carousel-btn:hover { background: rgba(34,31,30,0.9); }
    .p6-carousel-dots {
      position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 5px;
    }
    .p6-carousel-dot {
      width: 4px; height: 4px; border-radius: 50%;
      background: rgba(255,255,255,0.25); cursor: pointer; transition: background 0.2s;
    }
    .p6-carousel-dot.is-active { background: #fff; }

    /* Map embed */
    .p6-map { width: 100%; flex: 1; min-height: 0; border-radius: 18px; overflow: hidden; }
    .p6-map iframe { width: 100%; height: 100%; border: none; display: block; }

    /* Right panel */
    .p6-right {
      flex: 0 0 30%;
      align-self: stretch;
      padding: 80px 5% 52px 0;
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    .p6-title {
      font-family: 'Inter', sans-serif;
      font-size: clamp(22px, 2.6vw, 38px);
      font-weight: 600;
      color: #fff; line-height: 1.1; letter-spacing: -0.02em;
      margin-bottom: 0.5em;
    }
    .p6-features {
      list-style: none;
      font-family: 'Inter', sans-serif;
      font-size: clamp(12px, 1vw, 15px);
      font-weight: 300; color: rgba(255,255,255,0.75); line-height: 1.65;
    }
    .p6-note {
      font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 300;
      color: rgba(255,255,255,0.35); margin-top: 10px; line-height: 1.5;
    }
    .p6-price {
      font-family: 'Ogg', Georgia, serif;
      font-size: clamp(24px, 2.8vw, 46px);
      color: #fff; text-align: right; letter-spacing: -0.02em;
      margin-top: 20px;
    }
    .p6-price-iva {
      font-family: 'Inter', sans-serif; font-size: clamp(10px, 0.85vw, 13px);
      font-weight: 300; letter-spacing: 0.04em;
      color: rgba(255,255,255,0.45); vertical-align: middle; margin-left: 4px;
    }
    .td-iva {
      font-family: 'Inter', sans-serif; font-size: 9px; font-weight: 300;
      color: rgba(34,31,30,0.35); letter-spacing: 0.04em; margin-left: 3px;
    }

    /* Preu del menú — right panel table */
    .p6-preus-wrap {
      display: flex; flex-direction: column;
      width: 100%;
      max-height: calc(100vh - 160px); overflow: hidden;
      background: #F2EFEE; border-radius: 18px;
      padding: 36px 40px 32px;
    }
    .p6-preus-title {
      font-family: 'Inter', sans-serif; font-size: clamp(18px, 1.8vw, 26px);
      font-weight: 600; color: #221F1E; line-height: 1.1; letter-spacing: -0.02em;
      margin-bottom: 20px; flex-shrink: 0;
    }
    .p6-preus-filter { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 20px; flex-shrink: 0; }
    .p6-preus-pill {
      font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 400;
      letter-spacing: 0.09em; text-transform: uppercase;
      color: rgba(34,31,30,0.45); border: 1px solid rgba(34,31,30,0.22);
      border-radius: 100px; padding: 5px 14px; cursor: pointer; background: transparent;
      transition: all 0.2s ease;
    }
    .p6-preus-pill.is-active { color: #221F1E; border-color: rgba(34,31,30,0.7); background: rgba(34,31,30,0.07); }
    .p6-preus-scroll { overflow-y: auto; flex: 1; min-height: 0; }
    .p6-preus-scroll::-webkit-scrollbar { width: 3px; }
    .p6-preus-scroll::-webkit-scrollbar-thumb { background: rgba(34,31,30,0.15); border-radius: 2px; }
    .p6-preus-table { width: 100%; border-collapse: collapse; }
    .p6-preus-table tr { border-bottom: 1px solid rgba(34,31,30,0.08); }
    .p6-preus-table tr.is-dimmed td { opacity: 0.12; }
    .p6-preus-table td {
      font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 300;
      color: rgba(34,31,30,0.72); padding: 10px 0; vertical-align: middle;
      line-height: 1.4; transition: opacity 0.2s ease;
    }
    .p6-preus-table .td-min { text-align: center; padding: 10px 14px; color: rgba(34,31,30,0.35); white-space: nowrap; }
    .p6-preus-table .td-price { text-align: right; font-weight: 500; font-size: 13px; color: #221F1E; white-space: nowrap; }
    .p6-preus-thead td {
      font-size: 9px; letter-spacing: 0.13em; text-transform: uppercase;
      color: rgba(34,31,30,0.3); font-weight: 500; padding-bottom: 10px;
      border-bottom: 1px solid rgba(34,31,30,0.15);
    }
    .p6-preus-footnote {
      font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 300;
      color: rgba(34,31,30,0.35); margin-top: 14px; line-height: 1.6; flex-shrink: 0;
    }

    /* ── GALERIA GRID ── */
    .p6-layout.is-galeria .p6-center { padding: 96px 40px 52px; }
    .p6-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .p6-grid-item {
      aspect-ratio: 3/2; overflow: hidden; border-radius: 6px;
      cursor: pointer; position: relative;
    }
    .p6-grid-item img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform 0.35s ease, opacity 0.35s ease;
    }
    .p6-grid-item:hover img { transform: scale(1.05); opacity: 0.8; }

    /* ── LIGHTBOX ── */
    .p6-lightbox {
      position: fixed; inset: 0; z-index: 60;
      background: rgba(34,31,30,0.96);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.28s ease;
    }
    .p6-lightbox.open { opacity: 1; pointer-events: auto; }
    .p6-lightbox-img {
      max-width: 80vw; max-height: 82vh;
      object-fit: contain; display: block; border-radius: 4px;
      transition: opacity 0.2s ease;
    }
    .p6-lightbox-img.is-loading { opacity: 0; }
    .p6-lightbox-close {
      position: absolute; top: 28px; right: 36px;
      width: 40px; height: 40px;
      background: none; border: 1px solid rgba(255,255,255,0.2); border-radius: 50%;
      cursor: pointer; color: rgba(255,255,255,0.65);
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s, color 0.2s;
    }

  <script>
  /* ═══════════════════════════════════════════════════════
     WHEEL ENGINE
  ═══════════════════════════════════════════════════════ */

  const KF = [
    { size: 58, op: 1.00, ls: -.025, blur: 0   },   // dist 0 — centre
    { size: 43, op: 0.32, ls: -.015, blur: 2.5 },   // dist ±1
    { size: 32, op: 0.08, ls:  .000, blur: 5.5 },   // dist ±2
  ];
  const SPRING = 0.14, SNAP_THR = 0.25;

  const mod   = (n, m) => ((n % m) + m) % m;
  const lerp  = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  function styleAt(d) {
    const da = Math.abs(d);
    const [a, b] = da <= 1 ? [KF[0], KF[1]] : [KF[1], KF[2]];
    const t = da <= 1 ? da : clamp(da - 1, 0, 1);
    return { size: lerp(a.size, b.size, t), op: lerp(a.op, b.op, t), ls: lerp(a.ls, b.ls, t), blur: lerp(a.blur, b.blur, t) };
  }

  function makeWheel(trackEl, listEl, items, onSelect, startIdx = 0) {
    let cur = startIdx, vo = 0, to = 0, raf = null;
    const N = items.length;
    const H = () => listEl.querySelector('.wheel-item')?.offsetHeight ?? 80;

    function build() {
      listEl.innerHTML = '';
      for (let i = -2; i <= 2; i++) {
        const el = document.createElement('div');
        el.className   = 'wheel-item';
        el.textContent = items[mod(cur + i, N)];
        listEl.appendChild(el);
      }
    }

    function refresh() {
      listEl.querySelectorAll('.wheel-item').forEach((el, i) =>
        el.textContent = items[mod(cur + (i - 2), N)]);
    }

    function paint(px) {
      vo = px;
      listEl.style.transform = `translateY(${px}px)`;
      const h = H();
      listEl.querySelectorAll('.wheel-item').forEach((el, i) => {
        const s = styleAt((i - 2) + px / h);
        el.style.fontSize      = `${s.size}px`;
        el.style.opacity       =  s.op;
        el.style.letterSpacing = `${s.ls}em`;
        el.style.filter        = `blur(${s.blur.toFixed(2)}px)`;
      });
    }

    function tick() {
      vo += (to - vo) * SPRING;
      if (Math.abs(to - vo) < SNAP_THR) {
        cur = mod(cur - Math.round(to / H()), N);
        vo = 0; to = 0;
        paint(0); refresh();
        raf = null; return;
      }
      paint(vo);
      raf = requestAnimationFrame(tick);
    }

    function anim() { if (!raf) raf = requestAnimationFrame(tick); }

    function go(dir) {
      const h = H();
      to = clamp(to + dir * -h, -h * 2, h * 2);
      anim();
    }

    // ── Mouse wheel ──
    let snapTimer = null;
    trackEl.addEventListener('wheel', e => {
      e.preventDefault();
      const h = H();
      to = clamp(to - e.deltaY * (h / 120), -h * 2, h * 2);
      anim();
      clearTimeout(snapTimer);
      snapTimer = setTimeout(() => {
        to = clamp(Math.round(to / h) * h, -h * 2, h * 2);
        anim();
      }, 150);
    }, { passive: false });

    // ── Touch ──
    let ty0 = 0, tv0 = 0, tyL = 0, ttL = 0, vel = 0, drag = false;
    trackEl.addEventListener('touchstart', e => {
      if (raf) { cancelAnimationFrame(raf); raf = null; }
      drag = true; ty0 = e.touches[0].clientY; tv0 = vo;
      tyL = ty0; ttL = performance.now(); vel = 0;
    }, { passive: true });
    trackEl.addEventListener('touchmove', e => {
      if (!drag) return;
      const y = e.touches[0].clientY, now = performance.now(), dt = now - ttL;
      if (dt > 0) vel = (y - tyL) / dt * 16;
      tyL = y; ttL = now;
      const h = H();
      paint(clamp(tv0 + (y - ty0), -h * 1.5, h * 1.5));
      to = vo;
    }, { passive: true });
    trackEl.addEventListener('touchend', () => {
      if (!drag) return; drag = false;
      const h = H();
      to = clamp(Math.round((vo + vel * 4) / h) * h, -h * 2, h * 2);
      anim();
    }, { passive: true });

    // ── Click ──
    listEl.addEventListener('click', e => {
      const item = e.target.closest('.wheel-item');
      if (!item) return;
      const pos = [...listEl.querySelectorAll('.wheel-item')].indexOf(item) - 2;
      if (pos === 0) onSelect(items[cur]);
      else go(pos);
    });

    // ── Keyboard (only when parent page is active) ──
    document.addEventListener('keydown', e => {
      if (!trackEl.closest('.page')?.classList.contains('is-active')) return;
      if      (e.key === 'ArrowDown') go(1);
      else if (e.key === 'ArrowUp')   go(-1);
      else if (e.key === 'Enter')     onSelect(items[cur]);
    });

    build(); paint(0);
    return { selected: () => items[cur] };
  }

  /* ═══════════════════════════════════════════════════════
     NAVIGATION
  ═══════════════════════════════════════════════════════ */

  const LABELS = {
    'Català':  ['Inici', 'Any',  'Visió',    'Espais',   'Finca'],
    'Español': ['Inicio', 'Año',  'Visión',   'Espacios', 'Finca'],
    'English': ['Home', 'Year', 'Overview', 'Venues', 'Venue'],
  };
  const PAGES = [
    { id: 'page-0' },
    { id: 'page-1' },
    { id: 'page-2' },
    { id: 'page-3' },
    { id: 'page-4' },
    { id: 'page-5' },
  ];

  let curPage = 0;
  const sel   = {};   // { language, year, … }

  const header  = document.getElementById('siteHeader');
  const overlay = document.getElementById('menuOverlay');
  const navList = document.getElementById('overlayNav');

  function navigate(to) {
    if (to === curPage) return;
    const fwd   = to > curPage;
    const fromEl = document.getElementById(PAGES[curPage].id);
    const toEl   = document.getElementById(PAGES[to].id);

    // Exit current page
    fromEl.className = `page ${fwd ? 'is-above' : 'is-below'}`;

    // Stage entering page at its start position, then animate in
    toEl.className = `page ${fwd ? 'is-below' : 'is-above'}`;
    void toEl.offsetHeight;
    requestAnimationFrame(() => { toEl.className = 'page is-active'; });

    curPage = to;
    header.classList.toggle('nav-on', curPage > 0);
    header.classList.toggle('is-light', to === 3);
    header.classList.toggle('is-venue', to === 4 || to === 5);
    rebuildNav();
    if (to === 2) requestAnimationFrame(initPage2);
    if (to === 3) requestAnimationFrame(initPage3);
    if (to === 4) requestAnimationFrame(initPage4);
    if (to === 5) requestAnimationFrame(initPage5);
  }

  function rebuildNav() {
    navList.innerHTML = '';
    const lang = sel.language || 'Català';
    for (let i = 0; i < curPage; i++) {

  // Styles per distance from active item
  const P3_DIST = [
    { size:120, op:1.00, ls:-.025, blur: 0   },  // 0 — active
    { size: 72, op:0.48, ls:-.015, blur: 2   },  // 1
    { size: 54, op:0.24, ls: .000, blur: 4.5 },  // 2
    { size: 40, op:0.12, ls: .000, blur: 7   },  // 3+
  ];

  // Arc geometry constants
  // 180° maps to screen vertical centre (leftmost point of the circle)
  // Each item step rotates by ARC_STEP degrees along the circle
  const ARC_CENTER = 180;
  const ARC_STEP   = 17;

  let arcPos    = 0;   // continuous float — which item index is at centre
  let arcTarget = 0;
  let arcRaf    = null;
  let p3Built   = false;

  function p3StyleAt(da) {
    const max = P3_DIST.length - 1;
    const i = Math.min(Math.floor(da), max - 1);
    const t = clamp(da - i, 0, 1);
    const a = P3_DIST[i], b = P3_DIST[Math.min(i + 1, max)];
    return { size: lerp(a.size, b.size, t), op: lerp(a.op, b.op, t), ls: lerp(a.ls, b.ls, t), blur: lerp(a.blur, b.blur, t) };
  }

  // arcPaint computes every item's position and style from arcPos each frame
  function arcPaint() {
    const rightEl = document.getElementById('p3-right');
    if (!rightEl) return;
    const W = rightEl.offsetWidth, H = rightEl.offsetHeight;
    const cx = W, cy = H / 2, r = H * 0.45;
    const INFO_W = Math.min(280, W * 0.44);
    const activeIdx = Math.round(arcPos);

    document.querySelectorAll('.p3-item').forEach((el, i) => {
      // Item i sits at an angle offset from centre by (arcPos - i) steps
      const deg = ARC_CENTER + (arcPos - i) * ARC_STEP;
      const rad = deg * Math.PI / 180;
      const x   = cx + r * Math.cos(rad);
      const y   = cy + r * Math.sin(rad);

      el.style.left       = `${x - INFO_W}px`;
      el.style.top        = `${y}px`;
      el.style.visibility = (y >= -H * 0.2 && y <= H * 1.2) ? 'visible' : 'hidden';

      const sty = p3StyleAt(Math.abs(i - arcPos));
      const num = el.querySelector('.p3-item-num');
      num.style.fontSize      = `${sty.size}px`;
      num.style.opacity       =  sty.op;
      num.style.letterSpacing = `${sty.ls}em`;
      el.style.filter         = `blur(${sty.blur.toFixed(2)}px)`;
      el.querySelector('.p3-item-dot').style.opacity = i === activeIdx ? '1' : '0';
      const info = el.querySelector('.p3-item-info');
      i === activeIdx ? info.classList.remove('hidden') : info.classList.add('hidden');
      el.style.cursor        = i === activeIdx ? 'default' : 'pointer';
      el.style.pointerEvents = i === activeIdx ? 'none'    : 'auto';
    });
    const cta = document.getElementById('p3-cta');
    if (cta) cta.classList.add('is-visible');
  }

  function arcTick() {
    arcPos += (arcTarget - arcPos) * SPRING;
    arcPaint();
    if (Math.abs(arcTarget - arcPos) < 0.002) { arcPos = arcTarget; arcRaf = null; return; }
    arcRaf = requestAnimationFrame(arcTick);
  }

  function arcAnim() { if (!arcRaf) arcRaf = requestAnimationFrame(arcTick); }

  function arcMove(dir) {
    const N = document.querySelectorAll('.p3-item').length;
    arcTarget = clamp(arcTarget + dir, 0, N - 1);
    arcAnim();
  }

  const isMobile = () => window.innerWidth < 1024;

  function playArcHint() {
    if (isMobile()) return;
    let cancelled = false;
    const p2 = document.getElementById('page-2');
    const stop = () => { cancelled = true; };
    p2.addEventListener('wheel',      stop, { once: true, passive: true });
    p2.addEventListener('touchstart', stop, { once: true, passive: true });
    p2.addEventListener('keydown',    stop, { once: true });

    let t0 = null;
    const DURATION = 2200;
    const PEAK_T   = 0.52;
    const PEAK_POS = 2.0;

    function frame(ts) {
      if (cancelled || !p2.classList.contains('is-active')) {
        arcTarget = Math.round(arcPos);
        arcAnim();
        return;
      }
      if (!t0) t0 = ts;
      const t = Math.min((ts - t0) / DURATION, 1);
      let pos;
      if (t < PEAK_T) {
        const u = t / PEAK_T;
        pos = PEAK_POS * (1 - Math.pow(1 - u, 2.2));   // ease-out up
      } else {
        const u = (t - PEAK_T) / (1 - PEAK_T);
        pos = PEAK_POS * Math.pow(1 - u, 2.2);          // ease-in back
      }
      arcPos = pos; arcTarget = pos;
      arcPaint();
      if (t < 1) requestAnimationFrame(frame);
      else { arcPos = 0; arcTarget = 0; arcPaint(); }
    }
    requestAnimationFrame(frame);
  }

      p3El.addEventListener('wheel', e => {

          if (isMobile()) updateP2Mobile(items, Math.round(arcTarget));
        }, 150);
      }, { passive: false });

      let arcTx0 = 0, arcTy0 = 0, arcDrag = false, arcDragAxis = null;
      p3El.addEventListener('touchstart', e => {
        arcDrag = true; arcDragAxis = null;
        arcTx0 = e.touches[0].clientX;
        arcTy0 = e.touches[0].clientY;
        if (isMobile()) {
          const sl = document.getElementById('p2-mob-slides');
          if (sl) sl.style.transition = '';
        }
      }, { passive: true });
      p3El.addEventListener('touchmove', e => {
        if (!arcDrag) return;
        const dx = e.touches[0].clientX - arcTx0;
        const dy = e.touches[0].clientY - arcTy0;
        if (isMobile()) {
          // Determine axis on first significant move
          if (!arcDragAxis && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
            arcDragAxis = Math.abs(dx) >= Math.abs(dy) ? 'h' : 'v';
          }
          if (arcDragAxis === 'h') {
            e.preventDefault();
            const sl = document.getElementById('p2-mob-slides');
            if (sl) {
              const idx = Math.round(arcTarget);
              const N = items.length;
              const rubber = (idx === 0 && dx > 0) || (idx === N - 1 && dx < 0);
              const offset = rubber ? dx * 0.22 : dx;
              sl.style.transform = `translateX(calc(${-idx * 100}% + ${offset}px))`;
            }
          }
        } else {
          if (Math.abs(dy) >= 60) { arcMove(dy < 0 ? 1 : -1); arcTy0 = e.touches[0].clientY; }
        }
      }, { passive: false });
      p3El.addEventListener('touchend', e => {
        if (!arcDrag) { return; }
        arcDrag = false;
        if (isMobile() && arcDragAxis === 'h') {
          const dx = (e.changedTouches[0]?.clientX ?? arcTx0) - arcTx0;
          if (Math.abs(dx) > 36) {
            arcTarget = clamp(Math.round(arcTarget) + (dx < 0 ? 1 : -1), 0, items.length - 1);
            arcAnim();
          }
          updateP2Mobile(items, Math.round(arcTarget));
        }
        arcDragAxis = null;
      });
      document.addEventListener('keydown', e => {
        if (!document.getElementById('page-2').classList.contains('is-active')) return;
        if      (e.key === 'ArrowDown' || e.key === 'ArrowRight') { arcMove(1);  if (isMobile()) updateP2Mobile(items, Math.round(arcTarget)); }
        else if (e.key === 'ArrowUp'   || e.key === 'ArrowLeft')  { arcMove(-1); if (isMobile()) updateP2Mobile(items, Math.round(arcTarget)); }
      });
      window.addEventListener('resize', () => {
        const l = sel.language || 'Català';
        buildArc(P3_CONTENT[l] || P3_CONTENT['Català']);
      });
      p3Built = true;
    }
  }

  function buildArc(content) {
    const rightEl = document.getElementById('p3-right');
    const W = rightEl.offsetWidth, H = rightEl.offsetHeight;
    const cx = W, cy = H / 2, r = H * 0.45;
    const INFO_W = Math.min(280, W * 0.44);

    function degToXY(deg) {
      const rad = deg * Math.PI / 180;
      return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
    }

    // Static arc line — runs from near top to near bottom of viewport through 180°
    const svg = document.getElementById('p3-svg');
    svg.innerHTML = '';
    const s = degToXY(250), e = degToXY(110);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', 'rgba(255,255,255,0.15)');
    path.setAttribute('stroke-width', '1');
    // sweep=0 counterclockwise: 250° → 180° → 110°, the left-side arc
    path.setAttribute('d', `M ${s.x} ${s.y} A ${r} ${r} 0 0 0 ${e.x} ${e.y}`);
    svg.appendChild(path);

    // Build item DOM — positions are set by arcPaint() each frame
    const container = document.getElementById('p3-items');
    container.innerHTML = '';
    for (let i = 0; i < content.items.length; i++) {
      const item = document.createElement('div');
      item.className = 'p3-item';

      const info = document.createElement('div');
      info.className = 'p3-item-info hidden';
      info.style.width = `${INFO_W}px`;

      const lbl = document.createElement('div');
      lbl.className = 'p3-item-label';
      lbl.textContent = content.items[i].label;

      const dsc = document.createElement('div');
      dsc.className = 'p3-item-desc';
      dsc.textContent = content.items[i].desc;

      info.append(lbl, dsc);

      const num = document.createElement('div');
      num.className = 'p3-item-num';
      num.textContent = content.items[i].num;

      const dot = document.createElement('div');
      dot.className = 'p3-item-dot';

      item.append(info, num, dot);
      const idx = i;
      item.addEventListener('click', () => {
        arcTarget = idx;
        arcAnim();
      });
      container.appendChild(item);
    }

    arcPaint();
  }

  /* ═══════════════════════════════════════════════════════
     PAGE 4 — VENUE DETAIL
  ═══════════════════════════════════════════════════════ */

  function getVenueItems() {
    const venueIdx = sel.venueIdx ?? 0;
    const year     = sel.year || '2027';
    const vd       = VENUE_DATA[venueIdx];
    return vd.years[year] || vd.years['2027'] || vd.years['2026'] || [];
  }

  function buildItemList(containerEl, itemClass, items, lang, onHover, onClick) {
    containerEl.innerHTML = '';
    containerEl.classList.remove('has-hover');
    items.forEach((item, i) => {
      const el = document.createElement('div');
      el.className   = itemClass;
      el.textContent = (ITEM_LABELS[item.key] || {})[lang] || item.key;
      el.dataset.idx = i;
      containerEl.appendChild(el);
    });
    let activeIdx = -1;
    containerEl.onmousemove = e => {
      const els = [...containerEl.querySelectorAll('.' + itemClass)];
      let newIdx = -1;
      for (let j = 0; j < els.length; j++) {
        const r = els[j].getBoundingClientRect();
        if (e.clientY >= r.top - 6 && e.clientY <= r.bottom + 6) { newIdx = j; break; }
      }
      if (newIdx === -1 || newIdx === activeIdx) return;
      activeIdx = newIdx;
      els.forEach(el => el.classList.remove('is-active'));
      els[newIdx].classList.add('is-active');
      containerEl.classList.add('has-hover');
      if (onHover) onHover(newIdx);
    };
    containerEl.onmouseleave = () => {
      activeIdx = -1;
      containerEl.querySelectorAll('.' + itemClass).forEach(el => el.classList.remove('is-active'));
      containerEl.classList.remove('has-hover');
      if (onHover) onHover(-1);
    };
    if (onClick) {
      containerEl.onclick = e => {
        const el = e.target.closest('.' + itemClass);
        if (!el) return;
        onClick(parseInt(el.dataset.idx));
      };
    }
  }

  function initPage4() {
    const lang     = sel.language || 'Català';
    const venueIdx = sel.venueIdx ?? 0;
    document.getElementById('hdr-venue-name').innerHTML = VENUE_TITLES[venueIdx];
    const items = getVenueItems();
    buildItemList(
      document.getElementById('p5-list'), 'p5-item', items, lang,
      null,
      idx => {
        if (items[idx].type === 'reserva') { window.open('https://espaigastronomia.simplybook.it/v2/#book', '_blank'); return; }
        sel.itemIdx = idx; navigate(5);
      }
    );
  }

  /* ═══════════════════════════════════════════════════════
     LIGHTBOX
  ═══════════════════════════════════════════════════════ */

  let _lb = null, _lbImgs = [], _lbIdx = 0;
  let _carouselNav = null;

  document.addEventListener('keydown', e => {
    if (_lb && _lb.classList.contains('open')) return;
    if (!_carouselNav) return;
    if (e.key === 'ArrowLeft')  { e.preventDefault(); _carouselNav.prev(); }
    if (e.key === 'ArrowRight') { e.preventDefault(); _carouselNav.next(); }
  });

  function openLightbox(images, startIdx) {
    if (!_lb) {
      _lb = document.createElement('div');
      _lb.className = 'p6-lightbox';
      _lb.innerHTML = `
        <button class="p6-lightbox-close" id="lb-close">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M1 1L11 11M11 1L1 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="p6-lightbox-nav p6-lightbox-prev" id="lb-prev">
          <svg width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M7 1L1 7L7 13" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <img class="p6-lightbox-img" id="lb-img" src="" alt="">
        <button class="p6-lightbox-nav p6-lightbox-next" id="lb-next">
          <svg width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M1 1L7 7L1 13" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="p6-lightbox-counter" id="lb-counter"></div>`;
      document.body.appendChild(_lb);

      _lb.querySelector('#lb-close').onclick = closeLightbox;
      _lb.querySelector('#lb-prev').onclick  = e => { e.stopPropagation(); lbGoTo(_lbIdx - 1); };
      _lb.querySelector('#lb-next').onclick  = e => { e.stopPropagation(); lbGoTo(_lbIdx + 1); };
      _lb.onclick = e => { if (e.target === _lb) closeLightbox(); };

      document.addEventListener('keydown', e => {
        if (!_lb.classList.contains('open')) return;
        if (e.key === 'Escape')     closeLightbox();
        if (e.key === 'ArrowLeft')  lbGoTo(_lbIdx - 1);
        if (e.key === 'ArrowRight') lbGoTo(_lbIdx + 1);
      });
    }
    _lbImgs = images;
    lbGoTo(startIdx);
    _lb.classList.add('open');
  }

  function closeLightbox() { _lb.classList.remove('open'); }

  function lbGoTo(n) {
    _lbIdx = ((n % _lbImgs.length) + _lbImgs.length) % _lbImgs.length;
    const img = _lb.querySelector('#lb-img');
    img.classList.add('is-loading');
    img.onload = () => img.classList.remove('is-loading');
    img.src = _lbImgs[_lbIdx];
    _lb.querySelector('#lb-counter').textContent = `${_lbIdx + 1} / ${_lbImgs.length}`;
    const hasMult = _lbImgs.length > 1;
    _lb.querySelector('#lb-prev').style.display = hasMult ? '' : 'none';
    _lb.querySelector('#lb-next').style.display = hasMult ? '' : 'none';
  }

  /* ═══════════════════════════════════════════════════════
     CAROUSEL HELPER
  ═══════════════════════════════════════════════════════ */

  function makeCarousel(centerEl, images) {
    const wrap  = document.createElement('div');
    wrap.className = 'p6-carousel-wrap';

    const track = document.createElement('div');
    track.className = 'p6-carousel-track';
    images.forEach((src, i) => {
      const slide = document.createElement('div');
      slide.className = 'p6-carousel-slide' + (i === 0 ? ' is-active' : '');
      const img = document.createElement('img');
      img.src = src; img.alt = '';
      slide.appendChild(img);
      track.appendChild(slide);
    });
    wrap.appendChild(track);

    let cur = 0;
    function goTo(n) {
      const slides = track.querySelectorAll('.p6-carousel-slide');
      const dots   = wrap.querySelectorAll('.p6-carousel-dot');
      slides[cur].classList.remove('is-active');
      if (dots[cur]) dots[cur].classList.remove('is-active');
      cur = ((n % images.length) + images.length) % images.length;
      slides[cur].classList.add('is-active');
      if (dots[cur]) dots[cur].classList.add('is-active');
    }
    _carouselNav = { prev: () => goTo(cur - 1), next: () => goTo(cur + 1) };

    if (images.length > 1) {
      const nav  = document.createElement('div'); nav.className = 'p6-carousel-nav';
      const prev = document.createElement('button'); prev.className = 'p6-carousel-btn';
      prev.innerHTML = '<svg width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M7 1L1 7L7 13" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      const next = document.createElement('button'); next.className = 'p6-carousel-btn';
      next.innerHTML = '<svg width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M1 1L7 7L1 13" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      prev.onclick = () => goTo(cur - 1);
      next.onclick = () => goTo(cur + 1);
      nav.append(prev, next);
      wrap.appendChild(nav);

      const dotsEl = document.createElement('div'); dotsEl.className = 'p6-carousel-dots';
      images.forEach((_, i) => {
        const d = document.createElement('div');
        d.className = 'p6-carousel-dot' + (i === 0 ? ' is-active' : '');
        d.onclick = () => goTo(i);
        dotsEl.appendChild(d);
      });
      wrap.appendChild(dotsEl);
    }

    centerEl.innerHTML = '';
    centerEl.appendChild(wrap);
  }

  /* ═══════════════════════════════════════════════════════
     PAGE 5 — ITEM DETAIL
  ═══════════════════════════════════════════════════════ */

  function initPage5() {
    const lang     = sel.language || 'Català';
    const venueIdx = sel.venueIdx ?? 0;
    const itemIdx  = sel.itemIdx  ?? 0;
    const items    = getVenueItems();
    const notice   = document.getElementById('year-notice');
    const is2028   = sel.year === '2028';
    notice.classList.toggle('is-visible', is2028);
    document.getElementById('page-5').classList.toggle('has-notice', is2028);
    const item     = items[itemIdx] ?? items[0];
    const vd       = VENUE_DATA[venueIdx];

    document.getElementById('hdr-venue-name').innerHTML = VENUE_TITLES[venueIdx];

    // Left: same list, click changes item without page transition
    const listEl = document.getElementById('p6-list');
    buildItemList(listEl, 'p6-item', items, lang, null, idx => {
      if (items[idx].type === 'reserva') { window.open('https://espaigastronomia.simplybook.it/v2/#book', '_blank'); return; }
      sel.itemIdx = idx;
      renderItemDetail(items[idx], vd);
      listEl.querySelectorAll('.p6-item').forEach((el, i) => {
        el.classList.toggle('is-active', i === idx);
      });
      listEl.classList.add('has-hover');
    });
    // Persist selection when mouse leaves
    listEl.onmouseleave = () => {
      listEl.querySelectorAll('.p6-item').forEach((el, i) => {
        el.classList.toggle('is-active', i === sel.itemIdx);
      });
      listEl.classList.add('has-hover');
    };
    // Mark current active item
    const els = listEl.querySelectorAll('.p6-item');
    els[itemIdx]?.classList.add('is-active');
    listEl.classList.add('has-hover');

    // Mobile: horizontal pills nav
    const mobNav = document.getElementById('p6-mob-nav');
    mobNav.innerHTML = '';
    items.forEach((it, i) => {
      const pill = document.createElement('button');
      pill.className = 'p6-mob-pill' + (i === itemIdx ? ' is-active' : '');
      pill.textContent = (ITEM_LABELS[it.key] || {})[lang] || it.key;
      pill.onclick = () => {
        if (it.type === 'reserva') { window.open('https://espaigastronomia.simplybook.it/v2/#book', '_blank'); return; }
        sel.itemIdx = i;
        renderItemDetail(it, vd);
        mobNav.querySelectorAll('.p6-mob-pill').forEach((p, j) => p.classList.toggle('is-active', j === i));
        listEl.querySelectorAll('.p6-item').forEach((el, j) => el.classList.toggle('is-active', j === i));
        listEl.classList.add('has-hover');
      };
      mobNav.appendChild(pill);
    });
    const activePill = mobNav.querySelector('.p6-mob-pill.is-active');
    if (activePill) activePill.scrollIntoView({ block: 'nearest', inline: 'center' });

    renderItemDetail(item, vd);
  }

  function renderItemDetail(item, vd) {
    const lang      = sel.language || 'Català';
    const centerEl = document.getElementById('p6-center');
    const rightEl  = document.getElementById('p6-right');
    const layoutEl = document.getElementById('p6-layout');
    layoutEl.classList.toggle('is-galeria', item.type === 'galeria');
    layoutEl.classList.toggle('is-preus',   item.type === 'preus');

    // ── CENTER ──
    _carouselNav = null;
    if (item.type === 'mapa') {
      centerEl.innerHTML = `<div class="p6-map"><iframe src="${vd.mapSrc}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>`;
    } else if (item.type === 'galeria') {
      if (item.images && item.images.length > 0) {
        const grid = document.createElement('div');
        grid.className = 'p6-grid';
        item.images.forEach((src, i) => {
          const cell = document.createElement('div');
          cell.className = 'p6-grid-item';
          const img = document.createElement('img');
          img.src = src; img.alt = ''; img.loading = 'lazy';
          cell.appendChild(img);
          cell.onclick = () => openLightbox(item.images, i);
          grid.appendChild(cell);
        });
        centerEl.innerHTML = '';
        centerEl.appendChild(grid);
      } else {
        centerEl.innerHTML = `<div class="p6-media"><img src="${vd.fallback}" alt=""></div>`;
      }
    } else if (item.type === 'preus') {
      centerEl.innerHTML = '';
    } else {
      const imgs = (item.images && item.images.length > 0)
        ? item.images
        : item.img ? [item.img] : [vd.fallback];
      if (imgs.length > 1) {
        makeCarousel(centerEl, imgs);
      } else {
        centerEl.innerHTML = `<div class="p6-media"><img src="${imgs[0]}" alt=""></div>`;
      }
    }

    // ── RIGHT ──
    if (item.type === 'preus') {
      // Interactive price table
      const ui = PREUS_UI[lang] || PREUS_UI['Català'];
      const days = ['dis','div','diu','dll'];
      const langLabels = { dis: ui.dis, div: ui.div, diu: ui.diu, dll: ui.dll };
      let activeFilter = null;

      const wrap = document.createElement('div');
      wrap.className = 'p6-preus-wrap';

      const title = document.createElement('div');
      title.className = 'p6-preus-title';
      title.textContent = (ITEM_TITLES[item.key] || {})[lang] || (ITEM_TITLES[item.key] || {})['Català'] || item.key;
      wrap.appendChild(title);

      const filterEl = document.createElement('div');
      filterEl.className = 'p6-preus-filter';
      days.forEach(day => {
        const pill = document.createElement('button');
        pill.className = 'p6-preus-pill';
        pill.textContent = langLabels[day];
        pill.dataset.day = day;
        pill.onclick = () => {
          if (activeFilter === day) {
            activeFilter = null;
            filterEl.querySelectorAll('.p6-preus-pill').forEach(p => p.classList.remove('is-active'));
          } else {
            activeFilter = day;
            filterEl.querySelectorAll('.p6-preus-pill').forEach(p => p.classList.toggle('is-active', p.dataset.day === day));
          }
          tableEl.querySelectorAll('tr.data-row').forEach(row => {
            row.classList.toggle('is-dimmed', activeFilter !== null && row.dataset.day !== activeFilter);
          });
        };
        filterEl.appendChild(pill);
      });
      wrap.appendChild(filterEl);

      const scroll = document.createElement('div');
      scroll.className = 'p6-preus-scroll';

      const tableEl = document.createElement('table');
      tableEl.className = 'p6-preus-table';
      const thead = document.createElement('tr');
      thead.className = 'p6-preus-thead';
      thead.innerHTML = `<td>${ui.date}</td><td class="td-min">${ui.min}</td><td class="td-price">${ui.price}</td>`;
      tableEl.appendChild(thead);
      item.rows.forEach(row => {
        const tr = document.createElement('tr');
        tr.className = 'data-row';
        tr.dataset.day = row.day;
        const dateStr = (PREUSDATE_TRANS[lang] || {})[row.date] || row.date;
        tr.innerHTML = `<td>${dateStr}</td><td class="td-min">${row.min}</td><td class="td-price">${row.price}<span class="td-iva">+IVA</span></td>`;
        tableEl.appendChild(tr);
      });
      scroll.appendChild(tableEl);
      wrap.appendChild(scroll);

      if (item.notes) {
        item.notes.forEach(note => {
          const fn = document.createElement('div');
          fn.className = 'p6-preus-footnote';
          fn.textContent = (PREUSNOTE_TRANS[lang] || {})[note] || note;
          wrap.appendChild(fn);
        });
      }

      rightEl.innerHTML = '';
      rightEl.appendChild(wrap);

    } else if (item.type === 'mapa') {
      const coords = (vd.mapSrc.match(/[?&]q=([\d.,]+)/) || [])[1] || '';
      const mapsUrl = coords ? `https://www.google.com/maps?q=${coords}` : 'https://www.google.com/maps';
      const btnLabel = MAPS_BTN[lang] || MAPS_BTN['Català'];
      rightEl.innerHTML = `
        <div class="p6-title">${(ITEM_TITLES[item.key]||{})[lang]||(ITEM_TITLES[item.key]||{})['Català']||item.key}</div>
        <a class="p6-maps-btn" href="${mapsUrl}" target="_blank" rel="noopener noreferrer">
          ${btnLabel}
          <span class="p6-maps-btn-arrow"></span>
        </a>`;

    } else if (item.type === 'galeria') {
      rightEl.innerHTML = '';

    } else {
      // Standard item
      const titleKey    = (ITEM_TITLES[item.key]||{})[lang] || (ITEM_TITLES[item.key]||{})['Català'] || item.key;
      const titleHtml   = `<div class="p6-title">${titleKey}</div>`;
      const tFeat = FEAT_TRANS[lang] || {};
      const featuresHtml = item.features
        ? `<ul class="p6-features">${item.features.map(f => `<li>${tFeat[f] || f}</li>`).join('')}</ul>`
        : '';
      const tNote = NOTE_TRANS[lang] || {};
      const noteHtml  = item.note ? `<div class="p6-note">${tNote[item.note] || item.note}</div>` : '';
      const priceHtml = item.price ? `<div class="p6-price">${item.price}<span class="p6-price-iva">+IVA</span></div>` : '';
      rightEl.innerHTML = titleHtml + featuresHtml + noteHtml + priceHtml;
    }
  }
  </script>
